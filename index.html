<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kosár Shop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a night wholesale market. Aubergine dark, one tomato accent, the 3D warehouse is the single loud element. */
  --ink:#190f21; --plum:#26172f; --plum2:#33203f; --line:#4b3459;
  --cream:#f5ecdd; --mute:#b7a6c2;
  --tomato:#ff5b3a; --leaf:#a8d672; --saffron:#ffc247;
  --paper:#f7f0e2; --paperink:#2a1a36;
  --display:"Bricolage Grotesque","Reem Kufi",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(255,91,58,.13),transparent 60%),radial-gradient(700px 500px at 0% 30%,rgba(120,70,170,.16),transparent 60%);background-attachment:fixed}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

header{position:sticky;top:0;z-index:20;background:rgba(25,15,33,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--tomato)}
.brand small{font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--mute)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.bar2{padding-top:0}
[hidden]{display:none!important}
nav a{padding:7px 12px;border-radius:999px;color:var(--mute);text-decoration:none;white-space:nowrap;font-size:.92rem;font-weight:500;transition:background .2s,color .2s}
nav a:hover{color:var(--cream);background:var(--plum2)}
nav a.on{background:var(--tomato);color:#1b0d08}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 12px;cursor:pointer;font-size:.85rem;color:var(--mute)}
.lang button.on{background:var(--cream);color:var(--ink);font-weight:600}

main{max-width:1180px;margin:0 auto;padding:26px 16px 70px}
.view{display:flex;flex-direction:column;gap:22px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lead{color:var(--mute);max-width:65ch;margin:6px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;border:1px solid var(--line);color:var(--mute)}
.chip.warn{border-color:var(--saffron);color:var(--saffron)}
.chip.bad{border-color:var(--tomato);color:var(--tomato)}
.chip.ok{border-color:var(--leaf);color:var(--leaf)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--tomato)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.6vw,3.2rem);letter-spacing:-.02em;margin-top:18px}
.big small{display:block;font-family:var(--body);font-size:.85rem;font-weight:500;color:var(--mute);letter-spacing:0}
.trio{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
.trio div{font-size:.82rem;color:var(--mute)}
.trio b{display:block;font-family:var(--display);font-size:1.25rem;color:var(--cream)}
.stage{position:relative;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(51,32,63,.7),rgba(25,15,33,.2));min-height:380px;overflow:hidden}
.stage canvas{display:block;width:100%;height:380px;cursor:grab;touch-action:pan-y}
.stage .cap{position:absolute;inset-inline:14px;bottom:10px;display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--mute);pointer-events:none}
.fallback{padding:18px;display:flex;flex-direction:column;gap:8px}
.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
.steps a{color:var(--cream)}
.tip3d{position:absolute;z-index:3;background:var(--cream);color:var(--ink);padding:6px 12px;border-radius:999px;font-size:.84rem;font-weight:600;pointer-events:none;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tip3d[hidden]{display:none}
.loc{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;transition:border-color .2s,transform .15s}
.loc:hover{border-color:var(--tomato);transform:translateY(-2px)}
.loc .top{display:flex;justify-content:space-between;gap:10px}
.loc b{font-family:var(--display);font-size:1.2rem}
a.tile{text-decoration:none}
.fallback .row{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;font-size:.85rem}
.fallback i{display:block;height:10px;border-radius:5px}

/* grid children may shrink below their content, so wide tables scroll inside their card instead of stretching the page */
.two>*,.grid3>*,.hero>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:var(--plum);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.tilt{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,border-color .2s;transform-style:preserve-3d;will-change:transform}
.tilt:hover{border-color:var(--tomato)}
.tilt>*{transform:translateZ(18px)}
.card .own{font-size:.78rem;color:var(--mute)}
.card .p{font-family:var(--display);font-weight:800;font-size:1.7rem}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--mute);border-top:1px dashed var(--line);padding-top:6px}
.kv b{color:var(--cream);font-weight:500}
.neg{color:var(--tomato)!important}.pos{color:var(--leaf)!important}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--plum2)}
.split i{display:block}

.bars{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:8px;border-bottom:1px solid var(--line);direction:ltr}
.bars i{flex:1;background:linear-gradient(180deg,var(--tomato),#a83a52);border-radius:4px 4px 0 0;min-width:4px;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.axis{display:flex;justify-content:space-between;font-size:.76rem;color:var(--mute);direction:ltr}

/* forms */
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
form{display:flex;flex-direction:column;gap:12px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--mute)}
.range{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--mute);font-size:.85rem}
.range[hidden]{display:none}
.range input,.range select{width:auto;padding:6px 10px;border-radius:999px;font-size:.85rem}
input,select{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--cream);width:100%;min-width:0}
input[type=file]{padding:8px}
input[type=radio]{width:auto}
.btn{background:var(--tomato);color:#1b0d08;border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s;align-self:flex-start}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--cream)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.tile{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--mute);transition:transform .18s,border-color .18s,background .18s}
.tile span{font-size:1.7rem;line-height:1.2;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tile:hover span{transform:scale(1.25) rotate(-8deg)}
.tile.on{border-color:var(--tomato);background:rgba(255,91,58,.14);color:var(--cream);transform:translateY(-3px)}
.shot{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--line);align-self:flex-start}
.note{font-size:.84rem;color:var(--mute);margin:0}
.note.warn{color:var(--saffron)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:.78rem}
td.r,th.r{text-align:end}
/* Number cells are left-to-right even on the Arabic page, so alignment is set physically to keep headings above their figures */
[dir=rtl] th,[dir=rtl] td{text-align:right}
[dir=ltr] th,[dir=ltr] td{text-align:left}
[dir=rtl] th.r,[dir=rtl] td.r{text-align:left}
[dir=ltr] th.r,[dir=ltr] td.r{text-align:right}
td{unicode-bidi:plaintext}
.live{font-family:var(--display);font-size:1.3rem;font-weight:700}

/* report */
.paper{background:var(--paper);color:var(--paperink);border-radius:6px;padding:clamp(18px,4vw,44px);box-shadow:0 30px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:22px}
.paper h2{font-size:2rem}
.paper h3{border-bottom:2px solid var(--paperink);padding-bottom:4px}
.paper th,.paper td{border-color:#d8cdb8}
.paper th{color:#6b5a78}
.paper .neg{color:#c0321a!important}.paper .pos{color:#3d7a1c!important}
.paper .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.85rem;color:#6b5a78}
.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--cream);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:50;animation:rise .3s}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(10,5,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.viewer img{max-width:100%;max-height:82vh;border-radius:10px}
.gatebox{max-width:460px;margin:6vh auto 0;width:100%}
textarea{font:inherit;color:var(--cream);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:96px}
a.card{color:inherit;text-decoration:none;cursor:pointer}
.go{color:var(--tomato);font-weight:600;font-size:.88rem}
.tiles.scroll{max-height:440px;overflow-y:auto;padding:2px}
.tile[hidden]{display:none}
.q.qon{background:var(--tomato);border-color:var(--tomato);color:#1b0d08}
.tile.static{cursor:default}.tile.static b{color:var(--cream);font-size:1rem}
.aiout{white-space:pre-wrap;min-height:1.6em;border-inline-start:3px solid var(--tomato);padding-inline-start:12px;max-width:70ch}
.qs{display:flex;gap:8px;flex-wrap:wrap}
.q{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.86rem;color:var(--cream);transition:border-color .2s,transform .15s}
.q:hover{border-color:var(--tomato);transform:translateY(-2px)}
.meter{height:8px;background:var(--plum2);border-radius:4px;overflow:hidden;direction:ltr}
.meter i{display:block;height:100%;border-radius:4px}
.ask{flex-direction:row;gap:10px;flex-wrap:wrap}.ask input{flex:1;min-width:200px}
@media(max-width:820px){
  .hero,.two{grid-template-columns:minmax(0,1fr)}
  header{position:static}
  .bar{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .bar2{flex-direction:column;align-items:stretch;gap:8px;padding-bottom:10px}
  /* tabs become one swipeable row instead of a tall stack */
  nav{flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%;max-width:100%;min-width:0}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none;padding:8px 14px}
  .range{flex-wrap:wrap;width:100%;max-width:100%;min-width:0}
  .range input{flex:1 1 40%;min-width:0;font-size:16px;padding:7px 10px}
  .range select{flex:1 1 100%;font-size:16px;padding:7px 10px}
  main{padding:16px 12px 60px}
  .view{gap:16px}
  .card{padding:14px;border-radius:16px}
  .stage{min-height:300px}.stage canvas{height:300px}
  .stage .cap{font-size:.72rem}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  th,td{padding:7px 8px}
  .trio{gap:14px}
  .paper h2{font-size:1.5rem}
  .btn{align-self:stretch;text-align:center}
  .toast{max-width:calc(100vw - 24px);white-space:normal;text-align:center;border-radius:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tilt{transform:none!important}}
</style>
</head>

  <span style="flex:1"></span>

  <button type="button" class="q" id="out" data-act="signout" hidden></button>

const t=k=>T[k]?T[k][S.lang==='hu'?0:1]:k;
const L=o=>o[S.lang];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.round(n);return(n<0?'−':'')+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' Ft'};
const N=n=>`<span class="num">${fmt(n)}</span>`;
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const prod=id=>S.products.find(p=>p.id===id)||{hu:id,ar:id,e:'📦',c:'#888',kg:10};
const shopOf=id=>S.shops.find(s=>s.id===id);

/* ---------- maths ---------- */
const cv=c=>c.counted-((c.open||0)+c.cash-c.exp-(c.wages||0)); // wages are paid out of the drawer at closing
function shopStock(id){let last=null;S.counts.filter(c=>c.shop===id).forEach(c=>{if(!last||c.date>=last.date)last=c});const m={};
  if(last)Object.entries(last.items).forEach(([k,v])=>{if(v>0)m[k]=v});
  S.transfers.filter(x=>x.shop===id&&(!last||x.date>last.date)).forEach(x=>m[x.pid]=(m[x.pid]||0)+x.boxes);return{m,asOf:last?last.date:null}}
function nextOpen(id){let l=null;S.closes.filter(x=>x.shop===id).forEach(x=>{if(!l||x.date>=l.date)l=x});return l?Math.max(0,l.counted-(l.handed||0)):0}
let scope3D='wh';
const canItem=()=>['owner','partner','warehouse'].includes(role());
function scopeItems(){
  if(scope3D.startsWith('item:')){
    const pid=scope3D.slice(5),p=prod(pid),out=[],wh=Math.max(0,stock(pid));
    out.push({key:'wh',text:'🏭 '+t('wh')+' · '+wh,tip:t('wh')+' · '+wh+' '+t('boxes'),c:p.c,st:wh,go:allowed().includes('transfer')?'#transfer':''});
    S.shops.forEach(s=>{const b=shopStock(s.id).m[pid]||0;out.push({key:s.id,text:'🏪 '+L(s)+' · '+b,tip:L(s)+' · '+b+' '+t('boxes'),c:p.c,st:b,go:'#shop-'+s.id})});
    return out;
  }
  const m=scope3D==='wh'?null:shopStock(scope3D).m;
  return S.products.map(p=>{const st=m?(m[p.id]||0):stock(p.id);return{key:p.id,text:p.e+' '+st,tip:L(p)+' · '+st+' '+t('boxes'),c:p.c,st,go:canItem()?'#item-'+p.id:''}}).filter(x=>x.st>0).sort((a,b)=>b.st-a.st);
}
function invCost(pid){const r=S.receipts.filter(x=>x.pid===pid),b=sum(r,x=>x.boxes);return b?sum(r,x=>x.total)/b:0} // per box, from the invoices
// Cost of one box. A cost per kg typed by the owner wins over the invoices, for goods valued from now on.
function avgCost(pid){const p=S.products.find(x=>x.id===pid);return p&&+p.cost>0?p.cost*(+p.kg||1):invCost(pid)}
function moved(pid){return{inn:sum(S.receipts.filter(x=>x.pid===pid),x=>x.boxes),out:sum(S.transfers.filter(x=>x.pid===pid),x=>x.boxes),w:sum(S.whWaste.filter(x=>x.pid===pid),x=>x.boxes)}}
function stock(pid){const m=moved(pid);return m.inn-m.out-m.w}
// ---- period: any two dates (either end may be left open). The month list is only a shortcut that fills them in.
const inP=d=>(!ui.from||String(d)>=ui.from)&&(!ui.to||String(d)<=ui.to);
const dayBefore=d=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-1);return x.toISOString().slice(0,10)};
function setMonth(m){ui.month=m;if(m){const[y,mo]=m.split('-').map(Number);ui.from=m+'-01';ui.to=m+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0')}else{ui.from='';ui.to=''}}
function setRange(a,b){if(a&&b&&a>b)[a,b]=[b,a];ui.from=a||'';ui.to=b||'';ui.month=(a||b)?'custom':''}
const PD=a=>a.filter(x=>inP(x.date));
function months(){const s=new Set();[...S.closes,...S.receipts,...S.transfers].forEach(x=>s.add(String(x.date).slice(0,7)));return[...s].sort().reverse()}
// Value of the goods sitting in a shop at the end of day `upto`: the last evening count, plus what arrived after it.
// With no count at all the shop's stock is unknown, so it is valued at 0 and everything delivered counts as cost.
function shopStockAt(id,upto){
  let last=null;S.counts.forEach(c=>{if(c.shop===id&&c.date<=upto&&(!last||c.date>=last.date))last=c});
  if(!last)return null;
  const m={};Object.entries(last.items).forEach(([k,b])=>{if(b>0)m[k]=b});
  S.transfers.forEach(x=>{if(x.shop===id&&x.date>last.date&&x.date<=upto)m[x.pid]=(m[x.pid]||0)+x.boxes});
  return{m,asOf:last.date};
}
function shopInv(id,upto){const s=shopStockAt(id,upto);return s?{v:Math.round(sum(Object.entries(s.m),([k,b])=>b*avgCost(k))),asOf:s.asOf}:{v:0,asOf:null}}
// What left the shelf in the chosen period, per product: stock at the start + deliveries − stock at the last evening count.
// It is "sold or lost": spoilage and theft are inside it. null = the shop has no count yet, so nothing can be said.
function shopSold(id){
  const cl=shopStockAt(id,ui.to||'9999-12-31');if(!cl)return null;
  const op=ui.from?shopStockAt(id,dayBefore(ui.from)):null,inn={};
  PD(S.transfers).forEach(x=>{if(x.shop===id&&x.date<=cl.asOf)inn[x.pid]=(inn[x.pid]||0)+x.boxes}); // later deliveries are still on the shelf as far as we know
  const ids=new Set([...Object.keys(inn),...(op?Object.keys(op.m):[])]);
  const rows=[...ids].map(pid=>{const p=prod(pid),o=op?(op.m[pid]||0):0,i=inn[pid]||0,left=Math.min(o+i,cl.m[pid]||0),sold=Math.max(0,o+i-left),kg=sold*p.kg;return{p,o,i,left,sold,kg,val:Math.round(kg*(+p.price||0))}}).sort((a,b)=>b.val-a.val||b.sold-a.sold);
  return{rows,asOf:cl.asOf,expected:sum(rows,x=>x.val),unpriced:rows.filter(x=>x.sold>0&&!(+x.p.price>0)).length};
}
function shopStats(id){
  const c=PD(S.closes).filter(x=>x.shop===id),sales=sum(c,x=>x.cash+x.card),exp=sum(c,x=>x.exp),sent=sum(PD(S.transfers).filter(x=>x.shop===id),x=>x.cost);
  const op=ui.from?shopInv(id,dayBefore(ui.from)):{v:0},cl=shopInv(id,ui.to||'9999-12-31');
  const cogs=Math.max(0,op.v+sent-cl.v); // opening stock + deliveries − closing stock
  const wages=sum(c,x=>x.wages||0);
  return{sales,sent,cogs,exp,wages,stockVal:cl.v,stockAsOf:cl.asOf,waste:sum(c,x=>x.waste),vari:sum(c,cv),short:c.filter(x=>cv(x)<0).length,profit:sales-cogs-exp-wages,days:c.length};
}
function partnerStats(){
  const res={};PK.forEach(k=>res[k]={share:0,waste:0,draw:sum(PD(S.draws).filter(d=>d.partner===k),d=>d.amount)});
  const st=S.shops.map(sh=>({sh,s:shopStats(sh.id)}));
  st.forEach(({sh,s})=>PK.forEach(k=>res[k].share+=s.profit*ow(sh.own,k)/100));
  const W=sum(PD(S.whWaste),x=>x.cost),tc=sum(st,x=>x.s.sent);
  if(S.wasteMode==='own')PK.forEach(k=>res[k].waste=W*ow(S.whOwn,k)/100);
  if(S.wasteMode==='pull'&&tc)st.forEach(({sh,s})=>PK.forEach(k=>res[k].waste+=W*(s.sent/tc)*ow(sh.own,k)/100));
  PK.forEach(k=>res[k].balance=res[k].share-res[k].waste-res[k].draw);
  return res;
}

async function exportPdf(){
  const el=document.querySelector('.paper');if(exporting||!el)return;exporting=true;toast(t('making'));
  try{
    await lib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const canvas=await window.html2canvas(el,{scale:2,backgroundColor:'#f7f0e2',windowWidth:1240,onclone:doc=>{const p=doc.querySelector('.paper');p.style.width='1100px';p.style.boxShadow='none';p.style.borderRadius='0';doc.querySelectorAll('.view').forEach(v=>v.style.animation='none');doc.querySelectorAll('.paper .tw').forEach(x=>x.style.overflow='visible')}});
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),m=8,iw=210-2*m,k=canvas.width/iw,pageH=Math.floor((297-2*m)*k);
    for(let y=0,i=0;y<canvas.height;y+=pageH,i++){
      const hh=Math.min(pageH,canvas.height-y),c=document.createElement('canvas');c.width=canvas.width;c.height=hh;
      const x=c.getContext('2d');x.fillStyle='#f7f0e2';x.fillRect(0,0,c.width,hh);x.drawImage(canvas,0,y,canvas.width,hh,0,0,canvas.width,hh);
      if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,hh/k);
    }
    await saveFile('kosar-'+today()+'.pdf',pdf.output('blob'));
  }catch(e){toast(t('dlFail'))}
  exporting=false;
}

function label(text){
  const c=document.createElement('canvas'),x=c.getContext('2d'),F='700 52px system-ui,"Segoe UI","Noto Sans Arabic",sans-serif';x.font=F;
  const w=Math.max(150,Math.ceil(x.measureText(text).width)+60),hh=104,r=34;c.width=w;c.height=hh;

function crate(color){

  g.add(new THREE.Mesh(three.belt,mat));const tp=new THREE.Mesh(three.top,mat);tp.position.y=.25;g.add(tp);return g;

function build3D(){
  if(!three)return;const g=three.group;
  while(g.children.length){const ch=g.children.pop();if(ch.material&&ch.material.map){ch.material.map.dispose();ch.material.dispose()}}
  const items=scopeItems().slice(0,16);if(!items.length)return;
  const per=Math.max(1,Math.ceil(Math.max(1,...items.map(x=>x.st))/8)),cols=Math.ceil(Math.sqrt(items.length)),rows=Math.ceil(items.length/cols),sx=items.length<=4?2.9:2.15,sz=items.length<=4?2.4:1.85;
  three.t0=performance.now();
  items.forEach((it,i)=>{
    const cx=(i%cols-(cols-1)/2)*sx,cz=(Math.floor(i/cols)-(rows-1)/2)*sz,n=it.st>0?Math.max(1,Math.round(it.st/per)):0,ud={key:it.key,tip:it.tip,go:it.go};
    const fall=!reduced&&(animPid==='all'||animPid===it.key);
    const pad=new THREE.Mesh(three.pad,three.padMat);pad.position.set(cx,.02,cz);pad.scale.set(1,1,.8);pad.receiveShadow=true;pad.userData=ud;g.add(pad);
    for(let j=0;j<n;j++){
      const m=crate(it.c),ty=.3+j*.6;m.position.set(cx,fall?ty+8+j:ty,cz);m.rotation.y=((i*7+j*13)%9-4)*.03;
      m.userData=Object.assign({ty,delay:fall?(animPid==='all'?i*70:0)+j*90:0},ud);g.add(m);
    }
    const sp=label(it.text);sp.position.set(cx,.3+n*.6+.42,cz);Object.assign(sp.userData,ud);g.add(sp);
  });
  animPid=null;
}
function loop(now){
  requestAnimationFrame(loop);
  if(!three||!three.canvas.isConnected)return;
  if(!three.drag&&!three.hot&&!reduced)three.root.rotation.y+=.002;
  three.group.children.forEach(m=>{const u=m.userData;
    if(u.ty!==undefined&&m.position.y>u.ty&&now-three.t0>u.delay){m.position.y+=(u.ty-m.position.y)*.16;if(m.position.y-u.ty<.004)m.position.y=u.ty}
    if(u.bs){const k=u.key===three.hot?1.28:1;m.scale.x+=(u.bs[0]*k-m.scale.x)*.25;m.scale.y+=(u.bs[1]*k-m.scale.y)*.25}});
  three.renderer.render(three.scene,three.cam);
}

    const kg=num('r-kg');if(kg>0&&kg!==+p.kg){p.kg=kg;if(SB&&role()!=='staff')SB.from('products').update({kg}).eq('id',p.id).then(()=>{})}
    const rec={date:val('r-date'),pid:ui.pid,boxes,total,supplier:val('r-sup').trim()||'—',photo:!!ui.photo,paid_cash:!!($('r-paid')&&$('r-paid').checked)};
    if(SB){const pp=await storePhoto();rec.photo=!!pp;if(pp)rec.photo_path=pp}
    if(ui.orderId)rec.order_id=ui.orderId;
    if(!await add('receipts',rec))return;
    if(role()!=='staff'){await ensureSupplier(rec.supplier);await applyToOrder(rec,ui.orderId)}ui.orderId='';
    if(ui.photoUrl)URL.revokeObjectURL(ui.photoUrl);ui.photo=null;ui.photoUrl=null;ui.msg='';animPid=ui.pid;save();toast(t('saved')+' · '+boxes+' '+t('boxes'));location.hash='home';
  }
  if(f==='move'){
    const pid=val('m-pid'),date=val('m-date'),parts=S.shops.map(s=>({shop:s.id,b:Math.floor(num('m-s-'+s.id))})).filter(x=>x.b>0),w=Math.floor(num('m-waste')),tot=sum(parts,x=>x.b)+Math.max(0,w);
    if(!pid||tot<1)return toast(t('fill'));
    if(tot>stock(pid))return toast(t('tooMany'));
    const unit=avgCost(pid);
    for(const x of parts)if(!await add('transfers',{date,pid,boxes:x.b,shop:x.shop,cost:Math.round(x.b*unit)}))return render();
    if(w>0&&!await add('wh_waste',{date,pid,boxes:w,cost:Math.round(w*unit)}))return render();
    ui.movePid=pid;save();render();toast(t('saved')+' · '+tot+' '+t('boxes'));
  }
  if(f==='ship'){
    const shop=val('sh-shop'),date=val('sh-date'),rows=S.products.map(p=>({p,b:$('sh-p-'+p.id)?Math.floor(num('sh-p-'+p.id)):0})).filter(x=>x.b>0);
    if(!shop||!rows.length)return toast(t('fill'));
    const over=rows.find(x=>x.b>stock(x.p.id));if(over)return toast(t('tooMany')+' '+over.p.e+' '+L(over.p));
    let n=0;for(const x of rows){if(!await add('transfers',{date,pid:x.p.id,boxes:x.b,shop,cost:Math.round(x.b*avgCost(x.p.id))}))return render();n+=x.b}
    ui.shipShop=shop;save();render();toast(t('saved')+' · '+n+' '+t('boxes')+' → '+L(shopOf(shop)));
  }
  if(f==='prices'){
    let n=0;
    for(const x of S.products){
      const pr=$('pr-'+x.id),pk=$('pk-'+x.id),pc=$('pc-'+x.id);if(!pr)continue;const patch={};
      if(pr.value!==''){const v=Math.max(0,Math.round(parseFloat(pr.value)||0));if(v!==(+x.price||0))patch.price=v}
      if(pk&&pk.value!==''){const v=parseFloat(pk.value);if(v>0&&v!==+x.kg)patch.kg=v}
      if(pc){const v=Math.max(0,Math.round(parseFloat(pc.value)||0));if(v!==(+x.cost||0))patch.cost=v} // empty = back to the invoice cost
      if(Object.keys(patch).length){if(!await upd('products',x,patch))return render();n++}
    }
    render();toast(t('saved')+' · '+n);
  }
  if(f==='shop'){
    const name=val('ns-name').trim().slice(0,40);if(!name)return toast(t('fill'));const own={};PK.forEach(k=>own[k]=k==='o'?100:0);
    if(SB){const r=await SB.from('shops').insert({org_id:ME.org_id,hu:name,ar:name,own,sort:S.shops.length}).select().single();if(r.error)return toast(t('dbErr')+': '+r.error.message);S.shops.push(r.data)}
    else{S.shops.push({id:'s'+Date.now().toString(36),hu:name,ar:name,own});save()}
    render();toast(t('saved'));
  }
  if(f==='worker'){
    const name=val('wk-name').trim().slice(0,40),shop=val('wk-shop');if(!name||!shop)return toast(t('fill'));
    if(!await add('workers',{name,shop}))return;render();toast(t('saved'));
  }
  if(f==='pay'){
    const am=Math.round(num('py-amount')),sp=val('py-sup');if(am<1||!sp)return toast(t('fill'));
    if(!await add('payments',{date:val('py-date'),supplier:sp,amount:am}))return;render();toast(t('saved'));
  }
  if(f==='order'){
    const supn=(val('or-new').trim()||val('or-sup')).slice(0,60),pid=val('or-pid'),boxes=Math.floor(num('or-boxes'));if(!supn||!pid||boxes<1)return toast(t('fill'));
    await ensureSupplier(supn);
    if(!await add('orders',{date:val('or-date'),supplier:supn,pid,boxes,received:0,status:'open'}))return;
    render();toast(t('saved'));
  }
  if(f==='close'){
    const wg=wageNow();
    if(!await add('closes',{wages:wg.total,pay:wg.pay,date:val('c-date'),shop:val('c-shop'),cash:Math.round(num('c-cash')),card:Math.round(num('c-card')),exp:Math.round(num('c-exp')),waste:Math.round(num('c-waste')),counted:Math.round(num('c-counted')),open:Math.round(num('c-open')),handed:Math.round(num('c-handed'))}))return;
    save();render();toast(t('saved'));
  }
  if(f==='count'){
    const items={};e.target.querySelectorAll('input[data-k]').forEach(i=>{const b=Math.floor(parseFloat(i.value)||0);if(b>0)items[i.dataset.k]=b});
    if(!await add('counts',{date:val('k-date')||today(),shop:e.target.dataset.shop,items}))return;animPid='all';save();render();toast(t('saved'));
  }
  if(f==='partner'){
    const name=val('np-name').trim();if(!name)return toast(t('fill'));
    const key='p'+Date.now().toString(36).slice(-7),c=PCOLS[S.partners.length%PCOLS.length];
    if(SB){const r=await SB.from('partners').insert({org_id:ME.org_id,key,name,c,sort:S.partners.length}).select().single();if(r.error)return toast(t('dbErr')+': '+r.error.message);S.partners.push(r.data)}
    else{S.partners.push({key,hu:name,ar:name,c});save()}
    render();toast(t('saved'));
  }
  if(f==='newpass'){
    const r=await SB.auth.updateUser({password:val('np-pass')});if(r.error){authMsg=r.error.message;render();return}
    recovering=false;authMsg='';const s=await SB.auth.getSession();await enter(s.data.session);
  }
  if(f==='auth'){
    const email=val('au-email').trim(),password=val('au-pass');authMsg=t('loading');render();
    const r=authMode==='in'?await SB.auth.signInWithPassword({email,password}):await SB.auth.signUp({email,password});
    if(r.error){authMsg=r.error.message;render();return}
    if(!r.data.session){authMsg=t('checkMail');authMode='in';render();return}
    authMsg='';await enter(r.data.session);
  }
  if(f==='org'){
    const name=val('ob-name').trim(),names=val('ob-shops').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,20);if(!name||!names.length)return toast(t('fill'));
    const r=await SB.rpc('create_org',{org_name:name});if(r.error)return toast(t('dbErr')+': '+r.error.message);
    const a=await SB.from('shops').insert(names.map((n,i)=>({org_id:r.data,hu:n,ar:n,sort:i})));if(a.error)return toast(t('dbErr')+': '+a.error.message);
    const pn=val('ob-partners').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,10);
    if(pn.length){const c=await SB.from('partners').insert(pn.map((n,i)=>({org_id:r.data,key:String.fromCharCode(97+i),name:n.slice(0,60),c:PCOLS[(i+1)%PCOLS.length],sort:i+1})));if(c.error)return toast(t('dbErr')+': '+c.error.message)}
    const b=await SB.from('products').insert(P0.map(p=>({hu:p[1],ar:p[2],e:p[3],c:p[4],kg:p[5],sh:p[7],cat:p[8]})));if(b.error)return toast(t('dbErr')+': '+b.error.message);
    const s=await SB.auth.getSession();await enter(s.data.session);
  }
  if(f==='invite'){
    const rl=val('iv-role'),r=await SB.from('invites').insert({org_id:ME.org_id,email:val('iv-email').trim().toLowerCase(),role:rl,partner_key:rl==='partner'?val('iv-pk'):null,shop_id:rl==='staff'?val('iv-shop'):null});
    if(r.error)return toast(t('dbErr')+': '+r.error.message);await loadAll();render();toast(t('saved'));
  }
  if(f==='ask'){await askAI(val('a-q'))}
  if(f==='draw'){const am=Math.round(num('d-amount'));if(am<1)return toast(t('fill'));if(!await add('draws',{date:val('d-date'),partner:val('d-partner'),amount:am}))return;save();render();toast(t('saved'))}
  if(f==='setup'){
    const rows=[...S.shops.map(s=>s.id),'wh'],vals={};let ok=true;
    rows.forEach(id=>{vals[id]={};PK.forEach(k=>vals[id][k]=num('o-'+id+'-'+k));if(Math.abs(PK.reduce((x,k)=>x+vals[id][k],0)-100)>.001||PK.some(k=>vals[id][k]<0))ok=false});
    if(!ok){$('s-msg').textContent=t('sum100');return}
    S.shops.forEach(s=>{s.own=vals[s.id];const n=$('sn-'+s.id)&&$('sn-'+s.id).value.trim();if(n&&n!==L(s)){s.hu=n;s.ar=n}});S.whOwn=vals.wh;
    const renamed=[];S.partners.forEach(q=>{const n=$('pn-'+q.key)&&$('pn-'+q.key).value.trim();if(n&&n!==L(PARTNERS[q.key])){q.hu=n;q.ar=n;q.name=n;renamed.push(q)}});const wm=document.querySelector('input[name=wm]:checked');if(wm)S.wasteMode=wm.value;
    if(SB){const rs=await Promise.all([...renamed.map(q=>SB.from('partners').update({name:q.name}).eq('org_id',ME.org_id).eq('key',q.key)),...S.shops.map(s=>SB.from('shops').update({own:s.own,hu:s.hu,ar:s.ar}).eq('id',s.id)),SB.from('orgs').update({waste_mode:S.wasteMode,wh_own:S.whOwn}).eq('id',ME.org_id)]);const bad=rs.find(r=>r.error);if(bad)return toast(t('dbErr')+': '+bad.error.message)}
    save();render();toast(t('saved'));
  }
  if(f==='prod'){
    const hu=val('p-hu').trim(),ar=val('p-ar').trim();if(!hu||!ar)return toast(t('fill'));
    const cols=['#e5412d','#5fa144','#f08a24','#7a4fb3','#f2cf3a','#3f9a5a'];
    if(!await add('products',{hu,ar,e:val('p-e').trim()||'📦',c:cols[S.products.length%cols.length],kg:num('p-kg')||10,cat:val('p-cat')||'v'}))return;save();render();toast(t('saved'));
  }
});
addEventListener('hashchange',()=>{render();if(SB&&gate==='app'&&Date.now()-lastLoad>30000){const h=location.hash;flush().then(loadAll).then(()=>{if(location.hash===h&&!document.querySelector('form input:focus'))render()}).catch(()=>{})}});

/* ---------- boot ---------- */
function start(data){
  if(CFG.url&&CFG.key){S=blank();gate='load';render();lib('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js').then(bootDB).catch(e=>{authMsg=e.message||String(e);gate='auth';render()});return}
  S=data&&data.S;
  if(!S){try{S=JSON.parse(localStorage.getItem('kosar-data'))}catch(e){}}
  // Saved work is kept as it is; anything a newer version added is filled in with an empty default.
  S=S&&Array.isArray(S.products)&&Array.isArray(S.shops)?Object.assign(fresh(),S):fresh();
  init3D();render();
  window.claude?.hot?.snapshot?.(()=>({S}));
  const u=window.claude?.use?.('sample');
  if(u&&u.then)u.then(s=>{sampler=s||null;if(sampler&&(cur()==='insights'||(cur()==='receive'&&!$('r-boxes').value&&!$('r-total').value)))render()}).catch(()=>{});
  const u2=window.claude?.use?.('downloads');
  if(u2&&u2.then)u2.then(s=>{dl=s||null;if(dl&&cur()==='report')render()}).catch(()=>{});
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
